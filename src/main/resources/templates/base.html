<!doctype html>
<html
  lang="en"
  th:fragment="parent(content,title,script,showSidebar)"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Flowbite CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css"
      rel="stylesheet"
    />

    <!-- fontawsome -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <title
      th:text="${pageTitle != null ? pageTitle + ' | ContactSphere' : 'ContactSphere'}"
    >
      ContactSphere
    </title>
  </head>

  <body class="bg-slate-50 dark:bg-slate-950">
    <!-- Sidebar -->
    <div th:if="${showSidebar}" sec:authorize="isAuthenticated()">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <!-- Mobile sidebar backdrop -->
    <div
      id="sidebar-backdrop"
      class="fixed inset-0 z-30 hidden bg-black/40 md:hidden"
    ></div>

    <!-- Navbar: tumhara existing header isi tarah rakho -->
    <header
      class="fixed top-0 left-0 right-0 z-[100] bg-white dark:bg-slate-900"
      th:classappend="${showSidebar} ? ' md:left-64' : ''"
    >
      <div th:replace="~{fragments/navbar :: navbar}"></div>
    </header>

    <!-- Page Content -->
    <div
      class="min-h-screen pt-20"
      th:classappend="${showSidebar} ? ' md:ml-64' : ''"
    >
      <main class="min-h-screen"><div th:replace="${content}"></div></main>

      <!-- footer -->
      <footer
        class="border-t border-slate-200 bg-white p-4 text-center text-sm text-slate-500 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-400"
      >
        Welcome to ContactSphere
      </footer>
    </div>

    <!-- sidebar open close  -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const menuButton = document.getElementById("mobile-menu-toggle");
        const sidebar = document.getElementById("logo-sidebar");
        const backdrop = document.getElementById("sidebar-backdrop");

        if (!menuButton || !sidebar || !backdrop) return;

        function openSidebar() {
          sidebar.classList.remove("-translate-x-full");
          backdrop.classList.remove("hidden");
          menuButton.setAttribute("aria-expanded", "true");
        }

        function closeSidebar() {
          sidebar.classList.add("-translate-x-full");
          backdrop.classList.add("hidden");
          menuButton.setAttribute("aria-expanded", "false");
        }

        menuButton.addEventListener("click", function () {
          if (window.innerWidth >= 768) return;

          if (sidebar.classList.contains("-translate-x-full")) {
            openSidebar();
          } else {
            closeSidebar();
          }
        });

        backdrop.addEventListener("click", closeSidebar);

        window.addEventListener("resize", function () {
          if (window.innerWidth >= 768) {
            backdrop.classList.add("hidden");
            sidebar.classList.remove("-translate-x-full");
          } else {
            sidebar.classList.add("-translate-x-full");
            backdrop.classList.add("hidden");
          }
        });
      });
    </script>

    <th:block th:replace="${script}"></th:block>
  </body>
</html>
