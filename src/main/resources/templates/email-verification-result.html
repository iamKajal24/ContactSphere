<!doctype html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script}, false)}"
>
  <head>
    <title>Email Verification | ContactSphere</title>
  </head>

  <body>
    <div
      id="content"
      class="min-h-[80vh] flex items-center justify-center px-4 py-12"
    >
      <div
        class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-lg dark:border-gray-700 dark:bg-gray-800"
      >
        <!-- Success State -->
        <div th:if="${success}">
          <div
            class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-green-600 dark:bg-green-900/40 dark:text-green-400"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-9 w-9"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </div>

          <h1 class="mb-3 text-2xl font-bold text-gray-900 dark:text-white">
            Email Verified!
          </h1>

          <p
            class="mb-7 text-gray-600 dark:text-gray-300"
            th:text="${success}"
          ></p>

          <a
            th:href="@{/login}"
            class="inline-flex w-full items-center justify-center rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800"
          >
            Continue to Login
          </a>
        </div>

        <!-- Error State -->
        <div th:if="${error}">
          <div
            class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-9 w-9"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </div>

          <h1 class="mb-3 text-2xl font-bold text-gray-900 dark:text-white">
            Verification Failed
          </h1>

          <p
            class="mb-7 text-gray-600 dark:text-gray-300"
            th:text="${error}"
          ></p>

          <a
            th:href="@{/register}"
            class="inline-flex w-full items-center justify-center rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-700"
          >
            Back to Registration
          </a>
        </div>

        <p class="mt-6 text-sm text-gray-500 dark:text-gray-400">
          ContactSphere — Your contacts, organized.
        </p>
      </div>
    </div>

    <script>
      console.log("");
    </script>
  </body>
</html>
