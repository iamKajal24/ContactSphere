<!doctype html>

<html
  lang="en"
  th:replace="~{base::parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ContactSphere | Sign Up</title>
  </head>

  <body>
    <div id="content">
      <!-- Signup Page -->
      <main class="min-h-screen px-4 pt-6 pb-12 sm:px-6 sm:pt-8 lg:px-8">
        <!-- Signup Card -->
        <div
          class="mx-auto w-full max-w-lg rounded-2xl border border-default bg-neutral-primary-soft p-6 shadow-xl sm:p-8"
        >
          <!-- Header -->
          <div class="mb-8 text-center">
            <h1
              class="mb-2 text-3xl font-bold tracking-tight text-heading sm:text-4xl"
            >
              Create your account
            </h1>

            <p class="text-sm text-body">
              Join ContactSphere and manage your contacts securely.
            </p>
          </div>

          <!-- Message -->
          <div th:replace="~{fragments/message :: messagebox}"></div>

          <!-- Signup Form -->
          <form
            th:action="@{/register/do-register}"
            method="post"
            th:object="${userFormRequest}"
            class="space-y-2"
            novalidate
          >
            <!-- Name -->
            <div>
              <label
                for="name"
                class="mb-2 block text-sm font-medium text-heading"
              >
                Full Name
              </label>

              <input
                type="text"
                id="name"
                th:field="*{name}"
                name="name"
                autocomplete="name"
                placeholder="Enter your full name"
                class="block w-full rounded-lg border border-default bg-neutral-secondary-soft px-4 py-3 text-sm text-heading placeholder:text-body focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
              />
              <!-- Name Validation Error -->
              <p
                th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}"
                class="mt-1 text-sm text-red-600 dark:text-red-400"
              ></p>
            </div>

            <!-- Email -->
            <div>
              <label
                for="email"
                class="mb-2 block text-sm font-medium text-heading"
              >
                Email Address
              </label>

              <input
                type="email"
                id="email"
                th:field="*{email}"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
                class="block w-full rounded-lg border border-default bg-neutral-secondary-soft px-4 py-3 text-sm text-heading placeholder:text-body focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
              />
              <p
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}"
                class="mt-1 text-sm text-red-600 dark:text-red-400"
              ></p>
            </div>
            <!-- phoneNumber -->
            <div>
              <label
                for="phoneNumber"
                class="mb-2 block text-sm font-medium text-heading"
              >
                Phone Number
              </label>

              <input
                type="tel"
                id="phoneNumber"
                th:field="*{phoneNumber}"
                name="phoneNumber"
                autocomplete="tel"
                inputmode="numeric"
                maxlength="10"
                pattern="[0-9]{10}"
                placeholder="Enter your 10-digit phone number"
                class="block w-full rounded-lg border border-default bg-neutral-secondary-soft px-4 py-3 text-sm text-heading placeholder:text-body focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
              />
              <p
                th:if="${#fields.hasErrors('phoneNumber')}"
                th:errors="*{phoneNumber}"
                class="mt-1 text-sm text-red-600 dark:text-red-400"
              ></p>
            </div>

            <!-- Password -->
            <div>
              <label
                for="password"
                class="mb-2 block text-sm font-medium text-heading"
              >
                Password
              </label>

              <div class="relative">
                <input
                  type="password"
                  id="password"
                  th:field="*{password}"
                  name="password"
                  autocomplete="new-password"
                  minlength="8"
                  placeholder="Create a strong password"
                  class="block w-full rounded-lg border border-default bg-neutral-secondary-soft px-4 py-3 pr-12 text-sm text-heading placeholder:text-body focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                />

                <!-- Show / Hide Password -->
                <button
                  type="button"
                  id="togglePassword"
                  class="absolute inset-y-0 right-0 flex items-center px-4 text-body transition-colors hover:text-heading focus:outline-none"
                  aria-label="Show password"
                >
                  <!-- Eye Icon -->
                  <svg
                    id="eyeOpen"
                    class="h-5 w-5"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.25 12s3.5-6.75 9.75-6.75S21.75 12 21.75 12s-3.5 6.75-9.75 6.75S2.25 12 2.25 12Z"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>

                  <!-- Eye Slash Icon -->
                  <svg
                    id="eyeClosed"
                    class="hidden h-5 w-5"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3.98 8.223A10.477 10.477 0 0 0 2.25 12s3.5 6.75 9.75 6.75a9.74 9.74 0 0 0 5.02-1.39M6.23 6.23A9.74 9.74 0 0 1 12 5.25c6.25 0 9.75 6.75 9.75 6.75a10.49 10.49 0 0 1-2.26 3.77M3 3l18 18"
                    />
                  </svg>
                </button>
              </div>

              <p
                th:if="${#fields.hasErrors('password')}"
                th:errors="*{password}"
                class="mt-1 text-sm text-red-600 dark:text-red-400"
              ></p>
            </div>

            <!-- About -->
            <div>
              <label
                for="about"
                class="mb-2 block text-sm font-medium text-heading"
              >
                About
                <span class="font-normal text-body">(Optional)</span>
              </label>

              <textarea
                id="about"
                name="about"
                th:field="*{about}"
                rows="3"
                maxlength="500"
                placeholder="Tell us a little about yourself..."
                class="block w-full resize-none rounded-lg border border-default bg-neutral-secondary-soft px-4 py-3 text-sm text-heading placeholder:text-body focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
              ></textarea>

              <p
                th:if="${#fields.hasErrors('about')}"
                th:errors="*{about}"
                class="mt-1 text-sm text-red-600 dark:text-red-400"
              ></p>
            </div>

            <!-- Terms -->
            <div class="flex items-start gap-3">
              <input
                id="terms"
                type="checkbox"
                required
                class="mt-1 h-4 w-4 rounded border-default bg-neutral-secondary-soft text-blue-600 focus:ring-2 focus:ring-blue-500"
              />

              <label for="terms" class="text-sm text-body">
                I agree to the
                <a
                  href="#"
                  class="font-medium text-blue-600 hover:underline dark:text-blue-400"
                >
                  Terms & Conditions
                </a>
                and
                <a
                  href="#"
                  class="font-medium text-blue-600 hover:underline dark:text-blue-400"
                >
                  Privacy Policy </a
                >.
              </label>
            </div>

            <!-- Signup Button -->
            <button
              type="submit"
              class="w-full rounded-lg bg-blue-600 px-5 py-3 text-sm font-semibold text-white transition-all duration-200 hover:-translate-y-0.5 hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-500/25 focus:outline-none focus:ring-4 focus:ring-blue-500/30 dark:bg-blue-500 dark:hover:bg-blue-600"
            >
              Create Account
            </button>

            <!-- Divider -->
            <div class="flex items-center gap-4">
              <div class="h-px flex-1 bg-border"></div>

              <span class="text-xs font-medium uppercase text-body"> OR </span>

              <div class="h-px flex-1 bg-border"></div>
            </div>

            <!-- Google Signup -->
            <a
              th:href="@{/oauth2/authorization/google}"
              class="flex w-full items-center justify-center gap-3 rounded-lg border border-default bg-neutral-primary px-5 py-3 text-sm font-semibold text-heading transition-all duration-200 hover:bg-neutral-secondary-medium hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500/30"
            >
              <!-- Google Icon -->
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42Z"
                  fill="#4285F4"
                />

                <path
                  d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.75Z"
                  fill="#34A853"
                />

                <path
                  d="M6.53 13.83A5.85 5.85 0 0 1 6.22 12c0-.64.11-1.26.31-1.83V7.64H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.36l3.24-2.53Z"
                  fill="#FBBC05"
                />

                <path
                  d="M12 6.14c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.23 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.71 5.39l3.24 2.53C7.3 7.86 9.46 6.14 12 6.14Z"
                  fill="#EA4335"
                />
              </svg>

              Continue with Google
            </a>
          </form>

          <!-- Login -->
          <p class="mt-8 text-center text-sm text-body">
            Already have an account?

            <a
              th:href="@{/login}"
              class="font-semibold text-blue-600 hover:underline dark:text-blue-400"
            >
              Login
            </a>
          </p>
        </div>
      </main>
    </div>
  </body>

  <script>
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("password");
    const eyeOpen = document.getElementById("eyeOpen");
    const eyeClosed = document.getElementById("eyeClosed");

    togglePassword.addEventListener("click", () => {
      const isPassword = password.type === "password";

      password.type = isPassword ? "text" : "password";

      eyeOpen.classList.toggle("hidden", !isPassword);
      eyeClosed.classList.toggle("hidden", isPassword);

      togglePassword.setAttribute(
        "aria-label",
        isPassword ? "Hide password" : "Show password",
      );
    });
  </script>
</html>
