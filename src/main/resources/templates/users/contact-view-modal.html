<!-- ContactSphere: Compact Contact Details Modal -->
<div
  th:fragment="contactViewModal"
  id="contactViewModal"
  class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-950/50 p-3 backdrop-blur-sm sm:p-5"
  role="dialog"
  aria-modal="true"
  aria-labelledby="viewContactName"
>
  <section
    class="flex max-h-[75vh] w-full max-w-md flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl dark:border-slate-700 dark:bg-slate-900"
  >
    <!-- Header -->
    <header
      class="flex items-center justify-between border-b border-slate-100 px-4 py-2.5 dark:border-slate-700"
    >
      <div>
        <h2 class="text-sm font-bold text-slate-900 dark:text-white">
          Contact details
        </h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Your contact information
        </p>
      </div>

      <button
        type="button"
        id="closeContactModal"
        aria-label="Close contact details"
        class="rounded-lg p-1.5 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:hover:bg-slate-800 dark:hover:text-white"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          class="h-5 w-5"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m18 6-12 12M6 6l12 12"
          />
        </svg>
      </button>
    </header>

    <!-- Loading -->
    <div
      id="contactLoading"
      class="hidden py-8 text-center"
      role="status"
      aria-live="polite"
    >
      <div
        class="mx-auto h-7 w-7 animate-spin rounded-full border-4 border-slate-200 border-t-blue-600"
      ></div>
      <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">
        Loading contact...
      </p>
    </div>

    <!-- Error -->
    <div
      id="contactError"
      class="hidden m-3 rounded-lg bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950/40 dark:text-red-300"
      role="alert"
    ></div>

    <!-- Contact Details -->
    <div id="contactDetails" class="hidden overflow-y-auto">
      <div class="space-y-3 p-3 sm:p-4">
        <!-- Profile -->
        <div class="flex items-center gap-3">
          <img
            id="viewContactPicture"
            alt="Contact profile"
            class="hidden h-12 w-12 shrink-0 rounded-xl border border-slate-200 object-cover dark:border-slate-700"
          />

          <div
            id="viewContactInitial"
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 text-lg font-bold text-white"
          >
            C
          </div>

          <div class="min-w-0 flex-1">
            <h3
              id="viewContactName"
              class="break-words text-base font-bold text-slate-900 dark:text-white"
            ></h3>

            <p
              id="viewContactEmail"
              class="mt-0.5 break-all text-xs text-slate-500 dark:text-slate-400"
            ></p>

            <span
              id="viewContactFavorite"
              class="mt-1.5 inline-flex rounded-full px-2 py-0.5 text-xs font-semibold"
            ></span>
          </div>
        </div>

        <!-- Contact Information -->
        <section
          class="overflow-hidden rounded-xl border border-slate-200 dark:border-slate-700"
        >
          <div
            class="border-b border-slate-200 bg-slate-50 px-3 py-2 dark:border-slate-700 dark:bg-slate-800/60"
          >
            <h4
              class="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300"
            >
              Contact information
            </h4>
          </div>

          <dl class="grid grid-cols-1 sm:grid-cols-2">
            <!-- Phone -->
            <div
              class="border-b border-slate-100 px-3 py-2.5 dark:border-slate-800 sm:border-r"
            >
              <dt class="text-xs text-slate-500 dark:text-slate-400">
                Phone number
              </dt>
              <dd
                id="viewContactPhone"
                class="mt-0.5 break-words text-sm font-medium text-slate-800 dark:text-slate-200"
              ></dd>
            </div>

            <!-- Address -->
            <div
              class="border-b border-slate-100 px-3 py-2.5 dark:border-slate-800"
            >
              <dt class="text-xs text-slate-500 dark:text-slate-400">
                Address
              </dt>
              <dd
                id="viewContactAddress"
                class="mt-0.5 break-words text-sm font-medium text-slate-800 dark:text-slate-200"
              ></dd>
            </div>

            <!-- Website -->
            <div
              class="border-b border-slate-100 px-3 py-2.5 dark:border-slate-800 sm:border-r sm:border-b-0"
            >
              <dt class="text-xs text-slate-500 dark:text-slate-400">
                Website
              </dt>
              <dd class="mt-0.5 break-all text-xs">
                <a
                  id="viewContactWebsite"
                  class="hidden font-medium text-blue-600 hover:underline dark:text-blue-400"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Open website ↗
                </a>
                <span
                  id="viewContactWebsiteEmpty"
                  class="text-slate-400 dark:text-slate-500"
                >
                  Not provided
                </span>
              </dd>
            </div>

            <!-- LinkedIn -->
            <div class="px-3 py-2.5">
              <dt class="text-xs text-slate-500 dark:text-slate-400">
                LinkedIn
              </dt>
              <dd class="mt-0.5 break-all text-xs">
                <a
                  id="viewContactLinkedIn"
                  class="hidden font-medium text-blue-600 hover:underline dark:text-blue-400"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  View profile ↗
                </a>
                <span
                  id="viewContactLinkedInEmpty"
                  class="text-slate-400 dark:text-slate-500"
                >
                  Not provided
                </span>
              </dd>
            </div>
          </dl>
        </section>

        <!-- Description -->
        <section
          class="rounded-xl border border-slate-200 px-3 py-2.5 dark:border-slate-700"
        >
          <h4 class="text-xs font-bold text-slate-700 dark:text-slate-300">
            About this contact
          </h4>
          <dd
            id="viewContactDescription"
            class="mt-1 whitespace-pre-wrap break-words text-xs leading-5 text-slate-600 dark:text-slate-300"
          ></dd>
        </section>

        <!-- Timestamps -->
        <div class="grid grid-cols-2 gap-2">
          <div class="rounded-lg bg-slate-50 px-3 py-2 dark:bg-slate-800/70">
            <p class="text-xs text-slate-500 dark:text-slate-400">Created at</p>
            <p
              id="viewContactCreatedAt"
              class="mt-1 break-words text-xs font-semibold text-slate-700 dark:text-slate-200"
            ></p>
          </div>

          <div class="rounded-lg bg-slate-50 px-3 py-2 dark:bg-slate-800/70">
            <p class="text-xs text-slate-500 dark:text-slate-400">
              Last updated
            </p>
            <p
              id="viewContactUpdatedAt"
              class="mt-1 break-words text-xs font-semibold text-slate-700 dark:text-slate-200"
            ></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer
      class="flex shrink-0 justify-end border-t border-slate-100 bg-white px-4 py-2 dark:border-slate-700 dark:bg-slate-900"
    >
      <button
        type="button"
        id="closeContactModalFooter"
        class="rounded-lg bg-slate-100 px-4 py-1.5 text-xs font-semibold text-slate-700 transition hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700"
      >
        Close
      </button>
    </footer>
  </section>
</div>
