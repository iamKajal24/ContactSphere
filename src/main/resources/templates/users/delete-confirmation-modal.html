<div
  th:fragment="deleteConfirmationModal"
  id="deleteContactModal"
  class="fixed inset-0 z-[100] hidden items-center justify-center bg-gray-950/60 p-4 backdrop-blur-sm"
  role="dialog"
  aria-modal="true"
  aria-labelledby="deleteModalTitle"
  aria-describedby="deleteModalDescription"
>
  <div
    class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-6 shadow-2xl dark:border-gray-700 dark:bg-gray-800 sm:p-7"
  >
    <div
      class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400"
    >
      <svg
        class="h-7 w-7"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
          d="M12 9v4m0 4h.01M10.3 3.86 2.6 17.2A2 2 0 004.33 20h15.34a2 2 0 001.73-2.8L13.73 3.86a2 2 0 00-3.46 0z"
        />
      </svg>
    </div>

    <div class="mt-5 text-center">
      <h2
        id="deleteModalTitle"
        class="text-xl font-bold text-gray-900 dark:text-white"
      >
        Are you sure?
      </h2>

      <p
        id="deleteModalDescription"
        class="mt-2 text-sm leading-6 text-gray-500 dark:text-gray-400"
      >
        Do you really want to delete this contact? This action cannot be undone.
      </p>
    </div>

    <div class="mt-7 grid grid-cols-2 gap-3">
      <button
        id="cancelDeleteButton"
        type="button"
        class="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 transition hover:bg-gray-100 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 dark:focus:ring-gray-700"
      >
        Cancel
      </button>

      <button
        id="confirmDeleteButton"
        type="button"
        class="rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-300 dark:focus:ring-red-900"
      >
        Yes, delete
      </button>
    </div>
  </div>
</div>
