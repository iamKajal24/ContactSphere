<!doctype html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script}, false)}"
>
  <head>
    <title>ContactSphere | Direct Chat</title>
  </head>

  <body>
    <div id="content" class="mx-auto max-w-6xl px-3 py-5 sm:px-6 sm:py-8">
      <!-- Back Navigation -->
      <a
        th:href="@{/users/messages}"
        class="mb-4 inline-flex items-center gap-2 text-sm font-medium text-gray-600 transition hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
      >
        <svg
          class="h-5 w-5"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="m15 18-6-6 6-6"
          />
        </svg>
        All conversations
      </a>

      <!-- Chat Container -->
      <section
        class="flex h-[calc(100dvh-12rem)] min-h-[440px] max-h-[850px] flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-gray-800"
      >
        <!-- Chat Header -->
        <header
          class="flex items-center gap-3 border-b border-gray-200 bg-white px-4 py-4 dark:border-gray-700 dark:bg-gray-800 sm:px-6"
        >
          <div
            class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-blue-100 text-lg font-bold text-blue-700 dark:bg-blue-900/60 dark:text-blue-300"
          >
            <span
              th:text="${#strings.toUpperCase(#strings.substring(otherUser.name, 0, 1))}"
            >
              U
            </span>
          </div>

          <div class="min-w-0 flex-1">
            <h1
              class="truncate font-semibold text-gray-900 dark:text-white"
              th:text="${otherUser.name}"
            >
              User Name
            </h1>
            <p
              class="truncate text-sm text-gray-500 dark:text-gray-400"
              th:text="${otherUser.email}"
            >
              user@example.com
            </p>
          </div>

          <span
            class="hidden rounded-full bg-blue-50 px-3 py-1 text-xs font-medium text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 sm:inline-flex"
          >
            Direct Message
          </span>
        </header>

        <!-- Message History -->
        <div
          id="chatMessages"
          class="flex-1 space-y-4 overflow-y-auto bg-gray-50/70 px-3 py-5 dark:bg-gray-900/30 sm:px-6"
        >
          <!-- Empty Conversation -->
          <div
            th:if="${#lists.isEmpty(messages)}"
            class="flex h-full min-h-52 flex-col items-center justify-center text-center"
          >
            <div
              class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-100 dark:bg-blue-900/40"
            >
              <svg
                class="h-8 w-8 text-blue-600 dark:text-blue-400"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.7"
                  d="M8 10h8m-8 4h5m-9 5 1.5-4.5A8 8 0 1117 19H4z"
                />
              </svg>
            </div>

            <h2 class="font-semibold text-gray-900 dark:text-white">
              Start your conversation
            </h2>

            <p class="mt-2 max-w-xs text-sm text-gray-500 dark:text-gray-400">
              Send your first message and start connecting.
            </p>
          </div>

          <!-- Existing Messages -->
          <div
            th:each="message : ${messages}"
            class="flex w-full"
            th:classappend="${message.sender.userId == currentUser.userId}
                                  ? ' justify-end' : ' justify-start'"
          >
            <div
              class="max-w-[85%] sm:max-w-[70%]"
              th:classappend="${message.sender.userId == currentUser.userId}
                                      ? ' text-right' : ' text-left'"
            >
              <div
                class="rounded-2xl px-4 py-3 text-left shadow-sm"
                th:classappend="${message.sender.userId == currentUser.userId}
                            ? ' rounded-br-md bg-blue-600 text-white'
                            : ' rounded-bl-md border border-gray-200 bg-white text-gray-900 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100'"
              >
                <p
                  class="whitespace-pre-wrap break-words text-sm leading-6"
                  th:text="${message.content}"
                >
                  Message content
                </p>
              </div>

              <div
                class="mt-1 flex items-center gap-2 px-1 text-xs text-gray-500 dark:text-gray-400"
                th:classappend="${message.sender.userId == currentUser.userId}
                                          ? ' justify-end' : ' justify-start'"
              >
                <time
                  th:text="${#temporals.format(message.sentAt, 'dd MMM, hh:mm a')}"
                  th:datetime="${message.sentAt}"
                >
                  17 Oct, 12:30 PM
                </time>

                <span
                  th:if="${message.sender.userId == currentUser.userId
                                      and message.read}"
                  class="font-medium text-blue-500 dark:text-blue-400"
                >
                  Read
                </span>

                <span
                  th:if="${message.sender.userId == currentUser.userId
                                      and !message.read}"
                >
                  Sent
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Message Composer -->
        <form
          id="messageForm"
          th:action="@{/users/messages/{id}/send(id=${otherUser.userId})}"
          method="post"
          class="border-t border-gray-200 bg-white p-3 dark:border-gray-700 dark:bg-gray-800 sm:p-4"
        >
          <!-- Spring Security CSRF token -->
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          />

          <div class="flex items-end gap-2 sm:gap-3">
            <div class="min-w-0 flex-1">
              <label for="content" class="sr-only">Write a message</label>

              <textarea
                id="content"
                name="content"
                rows="1"
                maxlength="2000"
                required
                placeholder="Write your message..."
                class="block max-h-32 min-h-12 w-full resize-y rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:focus:border-blue-400 dark:focus:ring-blue-900"
              ></textarea>

              <p class="mt-1 px-1 text-xs text-gray-400">
                Maximum 2000 characters
              </p>
            </div>

            <button
              type="submit"
              id="sendButton"
              class="inline-flex h-12 shrink-0 items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 disabled:cursor-not-allowed disabled:opacity-50 dark:focus:ring-blue-800"
            >
              <span class="hidden sm:inline">Send</span>

              <svg
                class="h-5 w-5"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"
                />
              </svg>
            </button>
          </div>
        </form>
      </section>

      <p class="mt-3 text-center text-xs text-gray-500 dark:text-gray-400">
        Your messages are stored in ContactSphere.
      </p>
    </div>

    <script>
      // Scroll to the latest message when the chat page opens.
      document.addEventListener("DOMContentLoaded", function () {
        const chatMessages = document.getElementById("chatMessages");
        const messageForm = document.getElementById("messageForm");
        const contentInput = document.getElementById("content");
        const sendButton = document.getElementById("sendButton");

        if (chatMessages) {
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Grow the message box up to a reasonable height.
        if (contentInput) {
          contentInput.addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 128) + "px";
          });

          // Enter sends the message; Shift + Enter creates a new line.
          contentInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter" && !event.shiftKey) {
              event.preventDefault();

              if (this.value.trim() && messageForm) {
                messageForm.requestSubmit();
              }
            }
          });
        }

        if (messageForm && sendButton) {
          messageForm.addEventListener("submit", function () {
            sendButton.disabled = true;
          });
        }
      });
    </script>
  </body>
</html>
