<!doctype html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content}, ~{::title}, ~{::script}, false)}"
>
  <head>
    <title>My Feedback | ContactSphere</title>
  </head>

  <body>
    <section id="content" class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
      <div
        class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"
      >
        <div>
          <p
            class="mb-2 text-sm font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400"
          >
            Your submissions
          </p>
          <h1 class="text-3xl font-bold text-slate-900 dark:text-white">
            My Feedback
          </h1>
          <p class="mt-2 text-slate-600 dark:text-slate-400">
            Track your submitted feedback and its current status.
          </p>
        </div>

        <a
          th:href="@{/users/feedback}"
          class="inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-700"
        >
          <i class="fa-solid fa-plus"></i>
          New Feedback
        </a>
      </div>

      <!-- Empty state -->
      <div
        th:if="${#lists.isEmpty(feedbackList)}"
        class="rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center dark:border-slate-700 dark:bg-slate-900"
      >
        <div
          class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-50 text-blue-600 dark:bg-blue-950 dark:text-blue-400"
        >
          <i class="fa-regular fa-comment-dots text-2xl"></i>
        </div>

        <h2 class="text-xl font-semibold text-slate-900 dark:text-white">
          No feedback submitted yet
        </h2>

        <p
          class="mx-auto mt-2 max-w-md text-sm leading-6 text-slate-500 dark:text-slate-400"
        >
          Your feedback submissions will appear here after you send your first
          one.
        </p>

        <a
          th:href="@{/users/feedback}"
          class="mt-6 inline-flex items-center gap-2 rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-700"
        >
          Share your feedback
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

      <!-- Feedback list -->
      <div th:unless="${#lists.isEmpty(feedbackList)}" class="space-y-4">
        <article
          th:each="feedback : ${feedbackList}"
          class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-6"
        >
          <div
            class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between"
          >
            <div class="min-w-0 flex-1">
              <div class="mb-3 flex flex-wrap items-center gap-2">
                <span
                  class="rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700 dark:bg-blue-950 dark:text-blue-300"
                  th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(feedback.category.name(), '_', ' ')))}"
                ></span>

                <span
                  class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                  th:text="${#strings.replace(feedback.status.name(), '_', ' ')}"
                  th:classappend="${feedback.status.name() == 'RESOLVED'} ? ' !bg-green-100 !text-green-800 dark:!bg-green-950 dark:!text-green-300' : (${feedback.status.name() == 'REJECTED'} ? ' !bg-red-100 !text-red-800 dark:!bg-red-950 dark:!text-red-300' : '')"
                ></span>
              </div>

              <p
                class="whitespace-pre-wrap break-words text-sm leading-7 text-slate-700 dark:text-slate-300"
                th:text="${feedback.message}"
              ></p>

              <div
                class="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2 text-xs text-slate-500 dark:text-slate-400"
              >
                <span>
                  <i class="fa-regular fa-calendar mr-1"></i>
                  Submitted:
                  <time
                    th:text="${#temporals.format(feedback.createdAt, 'dd MMM yyyy, hh:mm a')}"
                  ></time>
                </span>

                <span>
                  <i class="fa-regular fa-star mr-1 text-amber-400"></i>
                  <span th:text="${feedback.rating}"></span>/5
                </span>
              </div>
            </div>
          </div>
        </article>
      </div>
    </section>

    <script></script>
  </body>
</html>
